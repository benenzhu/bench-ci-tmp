name: Tilelang kernel bench

on:
  push:
    branches:
      - master # only main pushes upload the baseline; feature pushes run via PR
  pull_request:  # any PR (any base) -- enables stacked PRs
  workflow_dispatch:

permissions:
  contents: read
  # Needed for `gh run list/download` to fetch the latest main run's CSV.
  actions: read
  # Needed for the sticky-pull-request-comment action to post bench results.
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      # The runner is non-interactive; ~/.bashrc isn't sourced. Pin the venv
      # and ROCm onto PATH/LD_LIBRARY_PATH explicitly so `python`, `pip`, and
      # the ROCm runtime resolve the same way as the user's interactive shell.
      PATH: /opt/venv/bin:/opt/rocm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rocm/lib

    steps:
      - name: Restore workspace ownership
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi

      - name: Checkout bench repo
        uses: actions/checkout@v4

      - name: Verify tilelang working tree is clean
        run: |
          docker ps

      - name: check gpu utils
        run: |
          amd-smi
          bash /find-pid-for-docker.sh

      - name: clone InferenceX
        run: |
          git clone git@github.com:SemiAnalysisAI/InferenceX.git --depth=1 -b amd_atom_kimi_patch
          cd InferenceX
          ls -lh
          ls -la
      
      - name: Run docker and check result
        env:
          # Each deploy key unlocks the repo matching its own name (confirmed by
          # the `ssh -T` probe below -- "Hi RadeonFlow/<repo>!"):
          #   secrets.ATOM_DEPLOY_KEY  -> RadeonFlow/AMD-ATOM
          #   secrets.AITER_DEPLOY_KEY -> RadeonFlow/aiter
          ATOM_REPO_KEY: ${{ secrets.ATOM_DEPLOY_KEY }}
          AITER_REPO_KEY: ${{ secrets.AITER_DEPLOY_KEY }}
        run: |
          cat > "$GITHUB_WORKSPACE/run_inferencex_bench.sh" <<'EOF'
          set -euo pipefail
          set -x

          # --- Build ATOM + aiter from source ------------------------------
          set +x  # don't echo the private deploy keys into the logs
          mkdir -p /root/.ssh && chmod 700 /root/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> /root/.ssh/known_hosts 2>/dev/null || true
          printf '%s\n' "$ATOM_REPO_KEY"  | tr -d '\r' > /root/.ssh/atom_key
          printf '%s\n' "$AITER_REPO_KEY" | tr -d '\r' > /root/.ssh/aiter_key
          chmod 600 /root/.ssh/atom_key /root/.ssh/aiter_key

          # --- deploy-key self-check (prints no private key material) -------
          # Confirms each key parses, and the "Hi owner/repo!" line from the
          # ssh probe tells you exactly which repo that deploy key unlocks.
          for k in atom_key aiter_key; do
            echo "### deploy-key check: $k ###"
            echo "first line: $(head -1 "/root/.ssh/$k")"
            echo "line count: $(wc -l < "/root/.ssh/$k")"
            if ssh-keygen -y -f "/root/.ssh/$k" >/dev/null 2>&1; then
              echo "$k: parses OK"
            else
              echo "$k: PARSE FAILED (malformed private key)"
            fi
            ssh -i "/root/.ssh/$k" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
              -T git@github.com 2>&1 || true
          done
          set -x

          pip uninstall -y flydsl triton amd-aiter atom || true

          cd /root
          GIT_SSH_COMMAND="ssh -i /root/.ssh/atom_key -o IdentitiesOnly=yes" \
            git clone git@github.com:RadeonFlow/AMD-ATOM.git
          cd /root/AMD-ATOM
          git checkout origin/radeonflow-tbo
          pip install -e .

          cd /root
          GIT_SSH_COMMAND="ssh -i /root/.ssh/aiter_key -o IdentitiesOnly=yes" \
            git clone git@github.com:RadeonFlow/aiter.git
          pip install setuptools-scm
          cd /root/aiter
          git checkout 01e553ad0b1cdcf886c535614a71e090a6608aa9
          pip install --ignore-installed --no-deps flydsl==0.1.8
          # `pip install -e .` already installs aiter editable in develop mode
          # (setuptools' editable_wheel command sets is_develop_mode()). The only
          # extra thing `python setup.py develop` did was install the aiter-compatible
          # triton -- but that path calls setup(setup_requires=...), which crashes in
          # setuptools' fetch_build_eggs when the venv has a dist with no Name. Run the
          # triton installer directly to avoid that legacy code path.
          pip install -e .
          bash .github/scripts/install_triton.sh

          cd /root/InferenceX
          mkdir -p /workspace

          # --- Port of scripts/serve.sh optimizations ----------------------
          # The upstream single_node atom bench script launches the server with
          # a minimal arg set and only exports OMP_NUM_THREADS + AITER_QUICK_
          # REDUCE_QUANTIZATION. serve.sh enables more. The ATOM_* knobs are
          # plain env vars the server reads directly, so we export them here
          # (inherited by `bash "$SCRIPT"` in the loop below). The matching
          # value of ATOM_ENABLE_HIP_MLA_DECODE is a literal port of serve.sh.
          export ATOM_DISABLE_MMAP=0
          export ATOM_USE_AITER_RP=1
          export ATOM_USE_TRITON_MXFP4_BMM=1
          export ATOM_ENABLE_HIP_MLA_DECODE=0

          # The remaining serve.sh optimizations are server CLI flags, and the
          # bench script hardcodes its server invocation (no env hook, and the
          # sweep config / generate_sweep_configs.py expose no server-args
          # field). Inject them by patching the cloned script before the loop.
          # Guard on the anchor so an upstream rewrite fails loudly instead of
          # silently running un-optimized.
          PATCH_SCRIPT="benchmarks/single_node/kimik2.5_fp4_mi355x_atom.sh"
          if ! grep -q -- '--trust-remote-code \\' "$PATCH_SCRIPT"; then
            echo "::error::serve.sh port: anchor not found in $PATCH_SCRIPT; upstream changed, refusing to run un-optimized."
            exit 1
          fi
          sed -i 's@--trust-remote-code \\@--max-num-batched-tokens 16384 --gpu-memory-utilization 0.7 --no-enable_prefix_caching --trust-remote-code \\@' "$PATCH_SCRIPT"
          grep -q -- '--max-num-batched-tokens 16384 --gpu-memory-utilization 0.7 --no-enable_prefix_caching' "$PATCH_SCRIPT" \
            || { echo "::error::serve.sh port: sed patch did not apply to $PATCH_SCRIPT"; exit 1; }
          echo "[serve.sh port] patched server flags into $PATCH_SCRIPT:"
          grep -n -- 'atom.entrypoints.openai_server\|--max-num-batched-tokens\|--gpu-memory-utilization\|--no-enable_prefix_caching' "$PATCH_SCRIPT"

          CONFIG_JSON=$(python3 utils/matrix_logic/generate_sweep_configs.py full-sweep --config-files .github/configs/amd-master.yaml --model-prefix kimik2.5-fp4-mi355x-atom --no-evals --max-tp=4 --min-conc=4 --max-conc=128 --seq-lens=8k1k)
          COUNT=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")

          if [ "$COUNT" -ne 6 ]; then
              echo "Expected 6 configs (conc 4,8,16,32,64,128), got $COUNT. Refine your filters."
              echo "$CONFIG_JSON" | python3 -m json.tool
              exit 1
          fi

          FAILED=()
          for i in $(seq 0 $((COUNT - 1))); do
          eval "$(echo "$CONFIG_JSON" | python3 -c "
          import json,sys; e=json.load(sys.stdin)[$i]
          m={
            'MODEL':e['model'],'TP':e['tp'],'CONC':e['conc'],'ISL':e['isl'],'OSL':e['osl'],
            'EP_SIZE':e.get('ep',1),'DP_ATTENTION':str(e.get('dp-attn',False)).lower(),
            'PRECISION':e['precision'],'FRAMEWORK':e['framework'],'IMAGE':e['image'],
            'EXP_NAME':e['exp-name'],'SPEC_DECODING':e.get('spec-decoding','none'),
            'RUN_EVAL':str(e.get('run-eval',False)).lower(),'RANDOM_RANGE_RATIO':'0.8',
            'RESULT_FILENAME':f\"{e['exp-name']}_{e['precision']}_{e['framework']}_tp{e['tp']}-ep{e.get('ep',1)}_conc{e['conc']}\"
          }
          for k,v in m.items(): print(f'export {k}=\"{v}\"')
          ")"

          FW_SUFFIX=$([[ "$FRAMEWORK" == "atom" ]] && echo '_atom' || echo '')
          SPEC_SUFFIX=$([[ "$SPEC_DECODING" == "mtp" ]] && echo '_mtp' || echo '')
          SCRIPT="benchmarks/single_node/${EXP_NAME%%_*}_${PRECISION}_mi355x${FW_SUFFIX}${SPEC_SUFFIX}.sh"

          echo "=== $SCRIPT | TP=$TP CONC=$CONC ISL=$ISL OSL=$OSL ==="
          if ! bash "$SCRIPT"; then
            echo "::warning::bench FAILED for conc=$CONC (tp=$TP)"
            FAILED+=("$CONC")
          fi
          done

          # ---- Aggregate per-GPU throughput into a markdown summary -------
          echo
          echo "============================================"
          echo "[sweep] Perf Sweep Summary"
          echo "============================================"
          echo "$CONFIG_JSON" | python3 -c "
          import json,sys,os,math
          configs=json.load(sys.stdin)
          rows=[]
          for e in configs:
            rf=f\"{e['exp-name']}_{e['precision']}_{e['framework']}_tp{e['tp']}-ep{e.get('ep',1)}_conc{e['conc']}\"
            path=f'/workspace/{rf}.json'
            tp=int(e['tp']); conc=int(e['conc'])
            if not os.path.exists(path):
              rows.append((conc,tp,None,None,None)); continue
            with open(path) as f: d=json.load(f)
            tot=float(d.get('total_token_throughput',float('nan')))
            out=float(d.get('output_throughput',float('nan')))
            rows.append((conc,tp,tot,out,tot/tp))
          rows.sort()
          print('| CONC | TP | total_token_throughput (tok/s) | output_throughput (tok/s) | per_gpu total (÷TP) (tok/s) |')
          print('| ---: | ---: | ---: | ---: | ---: |')
          for conc,tp,tot,out,pg in rows:
            if tot is None or math.isnan(tot):
              print(f'| {conc} | {tp} | MISSING | MISSING | MISSING |')
            else:
              print(f'| {conc} | {tp} | {tot:.2f} | {out:.2f} | {pg:.2f} |')
          "

          if [ "${#FAILED[@]}" -ne 0 ]; then
            echo "::error::benchmarks failed for conc: ${FAILED[*]}"
            exit 1
          fi
          EOF

          docker run --rm --init --network=host --privileged=true \
            -e PIP_CONSTRAINT="" \
            -e ATOM_REPO_KEY \
            -e AITER_REPO_KEY \
            -v /dev/shm:/dev/shm \
            --device /dev/kfd \
            --device /dev/dri   \
            --security-opt seccomp=unconfined \
            --entrypoint=/bin/bash \
            -v "$GITHUB_WORKSPACE/InferenceX:/root/InferenceX" \
            -v "$GITHUB_WORKSPACE/run_inferencex_bench.sh:/root/run_inferencex_bench.sh:ro" \
            -e HF_HUB_CACHE=/dev/shm \
            rocm/atom:rocm7.2.3_ubuntu24.04_py3.12_pytorch_release_2.10.0_atom20260511 \
            -lc 'bash /root/run_inferencex_bench.sh'
