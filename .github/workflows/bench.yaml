name: Tilelang kernel bench

on:
  push:
    branches:
      - master # only main pushes upload the baseline; feature pushes run via PR
  pull_request:  # any PR (any base) -- enables stacked PRs
  workflow_dispatch:

permissions:
  contents: read
  # Needed for `gh run list/download` to fetch the latest main run's CSV.
  actions: read
  # Needed for the sticky-pull-request-comment action to post bench results.
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      # The runner is non-interactive; ~/.bashrc isn't sourced. Pin the venv
      # and ROCm onto PATH/LD_LIBRARY_PATH explicitly so `python`, `pip`, and
      # the ROCm runtime resolve the same way as the user's interactive shell.
      PATH: /opt/venv/bin:/opt/rocm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rocm/lib

    steps:
      - name: Restore workspace ownership
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi

      - name: Checkout bench repo
        uses: actions/checkout@v4

      - name: Verify tilelang working tree is clean
        run: |
          docker ps

      - name: check gpu utils
        run: |
          amd-smi
          bash /find-pid-for-docker.sh

      - name: clone InferenceX
        run: |
          git clone git@github.com:SemiAnalysisAI/InferenceX.git --depth=1 -b amd_atom_kimi_patch
          cd InferenceX
          ls -lh
          ls -la
      
      - name: Run docker and check result
        env:
          # Deploy keys are intentionally crossed in the GitHub secrets:
          #   ATOM repo  -> secrets.AITER_DEPLOY_KEY
          #   aiter repo -> secrets.ATOM_DEPLOY_KEY
          # We re-map them here to names that match what they actually unlock.
          ATOM_REPO_KEY: ${{ secrets.AITER_DEPLOY_KEY }}
          AITER_REPO_KEY: ${{ secrets.ATOM_DEPLOY_KEY }}
        run: |
          cat > "$GITHUB_WORKSPACE/run_inferencex_bench.sh" <<'EOF'
          set -euo pipefail
          set -x

          # --- Build ATOM + aiter from source ------------------------------
          set +x  # don't echo the private deploy keys into the logs
          mkdir -p /root/.ssh && chmod 700 /root/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> /root/.ssh/known_hosts 2>/dev/null || true
          printf '%s\n' "$ATOM_REPO_KEY"  > /root/.ssh/atom_key
          printf '%s\n' "$AITER_REPO_KEY" > /root/.ssh/aiter_key
          chmod 600 /root/.ssh/atom_key /root/.ssh/aiter_key
          set -x

          pip uninstall -y flydsl triton amd-aiter atom || true

          cd /root
          GIT_SSH_COMMAND="ssh -i /root/.ssh/atom_key -o IdentitiesOnly=yes" \
            git clone git@github.com:RadeonFlow/AMD-ATOM.git
          cd /root/AMD-ATOM
          git checkout origin/to-upstream
          pip install -e .

          cd /root
          GIT_SSH_COMMAND="ssh -i /root/.ssh/aiter_key -o IdentitiesOnly=yes" \
            git clone git@github.com:RadeonFlow/aiter.git
          pip install setuptools-scm
          cd /root/aiter
          git checkout origin/to-upstream
          pip install -e .
          python setup.py develop

          cd /root/InferenceX
          mkdir -p /workspace

          CONFIG_JSON=$(python3 utils/matrix_logic/generate_sweep_configs.py full-sweep --config-files .github/configs/amd-master.yaml --model-prefix kimik2.5-fp4-mi355x-atom --no-evals --max-tp=4 --min-conc=4 --max-conc=4 --seq-lens=8k1k)
          COUNT=$(echo "$CONFIG_JSON" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")

          if [ "$COUNT" -ne 1 ]; then
              echo "Expected 1 config, got $COUNT. Refine your filters."
              echo "$CONFIG_JSON" | python3 -m json.tool
              exit 1
          fi

          eval "$(echo "$CONFIG_JSON" | python3 -c "
          import json,sys; e=json.load(sys.stdin)[0]
          m={
            'MODEL':e['model'],'TP':e['tp'],'CONC':e['conc'],'ISL':e['isl'],'OSL':e['osl'],
            'EP_SIZE':e.get('ep',1),'DP_ATTENTION':str(e.get('dp-attn',False)).lower(),
            'PRECISION':e['precision'],'FRAMEWORK':e['framework'],'IMAGE':e['image'],
            'EXP_NAME':e['exp-name'],'SPEC_DECODING':e.get('spec-decoding','none'),
            'RUN_EVAL':str(e.get('run-eval',False)).lower(),'RANDOM_RANGE_RATIO':'0.8',
            'RESULT_FILENAME':f\"{e['exp-name']}_{e['precision']}_{e['framework']}_tp{e['tp']}-ep{e.get('ep',1)}_conc{e['conc']}\"
          }
          for k,v in m.items(): print(f'export {k}=\"{v}\"')
          ")"

          FW_SUFFIX=$([[ "$FRAMEWORK" == "atom" ]] && echo '_atom' || echo '')
          SPEC_SUFFIX=$([[ "$SPEC_DECODING" == "mtp" ]] && echo '_mtp' || echo '')
          SCRIPT="benchmarks/single_node/${EXP_NAME%%_*}_${PRECISION}_mi355x${FW_SUFFIX}${SPEC_SUFFIX}.sh"

          echo "=== $SCRIPT | TP=$TP CONC=$CONC ISL=$ISL OSL=$OSL ==="
          bash "$SCRIPT"
          EOF

          docker run --rm --init --network=host --privileged=true \
            -e PIP_CONSTRAINT="" \
            -e ATOM_REPO_KEY \
            -e AITER_REPO_KEY \
            -v /dev/shm:/dev/shm \
            --device /dev/kfd \
            --device /dev/dri   \
            --security-opt seccomp=unconfined \
            --entrypoint=/bin/bash \
            -v "$GITHUB_WORKSPACE/InferenceX:/root/InferenceX" \
            -v "$GITHUB_WORKSPACE/run_inferencex_bench.sh:/root/run_inferencex_bench.sh:ro" \
            -e HF_HUB_CACHE=/dev/shm \
            rocm/atom:rocm7.2.3_ubuntu24.04_py3.12_pytorch_release_2.10.0_atom20260511 \
            -lc 'bash /root/run_inferencex_bench.sh'
