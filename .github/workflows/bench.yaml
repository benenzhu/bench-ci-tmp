name: Tilelang kernel bench

on:
  push:
    branches:
      - master # only main pushes upload the baseline; feature pushes run via PR
  pull_request:  # any PR (any base) -- enables stacked PRs
  workflow_dispatch:

permissions:
  contents: read
  # Needed for `gh run list/download` to fetch the latest main run's CSV.
  actions: read
  # Needed for the sticky-pull-request-comment action to post bench results.
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      # The runner is non-interactive; ~/.bashrc isn't sourced. Pin the venv
      # and ROCm onto PATH/LD_LIBRARY_PATH explicitly so `python`, `pip`, and
      # the ROCm runtime resolve the same way as the user's interactive shell.
      PATH: /opt/venv/bin:/opt/rocm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rocm/lib

    steps:
      - name: Restore workspace ownership
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi

      - name: Checkout bench repo
        uses: actions/checkout@v4

      - name: Verify tilelang working tree is clean
        run: |
          docker ps

      - name: check gpu utils
        run: |
          amd-smi
          bash /find-pid-for-docker.sh

      - name: clone InferenceX
        run: |
          git clone git@github.com:SemiAnalysisAI/InferenceX.git --depth=1 -b amd_atom_kimi_patch
          cd InferenceX
          ls -lh
          ls -la
      
      - name: Run docker and check result
        env:
          # Each deploy key unlocks the repo matching its own name (confirmed by
          # the `ssh -T` probe below -- "Hi RadeonFlow/<repo>!"):
          #   secrets.ATOM_DEPLOY_KEY  -> RadeonFlow/AMD-ATOM
          #   secrets.AITER_DEPLOY_KEY -> RadeonFlow/aiter
          ATOM_REPO_KEY: ${{ secrets.ATOM_DEPLOY_KEY }}
          AITER_REPO_KEY: ${{ secrets.AITER_DEPLOY_KEY }}
        run: |
          cat > "$GITHUB_WORKSPACE/run_inferencex_bench.sh" <<'EOF'
          set -euo pipefail
          set -x

          # --- Build ATOM + aiter from source ------------------------------
          set +x  # don't echo the private deploy keys into the logs
          mkdir -p /root/.ssh && chmod 700 /root/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> /root/.ssh/known_hosts 2>/dev/null || true
          printf '%s\n' "$ATOM_REPO_KEY"  | tr -d '\r' > /root/.ssh/atom_key
          printf '%s\n' "$AITER_REPO_KEY" | tr -d '\r' > /root/.ssh/aiter_key
          chmod 600 /root/.ssh/atom_key /root/.ssh/aiter_key

          # --- deploy-key self-check (prints no private key material) -------
          # Confirms each key parses, and the "Hi owner/repo!" line from the
          # ssh probe tells you exactly which repo that deploy key unlocks.
          for k in atom_key aiter_key; do
            echo "### deploy-key check: $k ###"
            echo "first line: $(head -1 "/root/.ssh/$k")"
            echo "line count: $(wc -l < "/root/.ssh/$k")"
            if ssh-keygen -y -f "/root/.ssh/$k" >/dev/null 2>&1; then
              echo "$k: parses OK"
            else
              echo "$k: PARSE FAILED (malformed private key)"
            fi
            ssh -i "/root/.ssh/$k" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
              -T git@github.com 2>&1 || true
          done
          set -x

          pip uninstall -y flydsl triton amd-aiter atom || true

          cd /root
          GIT_SSH_COMMAND="ssh -i /root/.ssh/atom_key -o IdentitiesOnly=yes" \
            git clone git@github.com:RadeonFlow/AMD-ATOM.git
          cd /root/AMD-ATOM
          git checkout 0170b8adafce52c3cb64403a1e3a2e21cbe83f5f
          pip install -e .

          cd /root
          GIT_SSH_COMMAND="ssh -i /root/.ssh/aiter_key -o IdentitiesOnly=yes" \
            git clone git@github.com:RadeonFlow/aiter.git
          pip install setuptools-scm
          cd /root/aiter
          git checkout df8ae91cd3b2d0c00727ec8fa769c0938e0ed55b
          pip install --ignore-installed --no-deps flydsl==0.1.8
          # `pip install -e .` already installs aiter editable in develop mode
          # (setuptools' editable_wheel command sets is_develop_mode()). The only
          # extra thing `python setup.py develop` did was install the aiter-compatible
          # triton -- but that path calls setup(setup_requires=...), which crashes in
          # setuptools' fetch_build_eggs when the venv has a dist with no Name. Run the
          # triton installer directly to avoid that legacy code path.
          pip install -e .
          bash .github/scripts/install_triton.sh

          cd /root/InferenceX
          mkdir -p /workspace

          # Reuse the shared bench helpers (wait_for_server_ready,
          # run_benchmark_serving, start/stop_gpu_monitor). Sourcing also sets
          # PYTHONDONTWRITEBYTECODE / PYTHONPYCACHEPREFIX.
          source benchmarks/benchmark_lib.sh

          # benchmark_lib.sh reads ${EVAL_ONLY} unguarded (run_benchmark_serving,
          # and again ~L868) -- upstream's single_node script sets it, but we
          # bypass that script and run under `set -u`, so an unset EVAL_ONLY
          # aborts. This is a perf sweep (--no-evals), so force the throughput
          # path (the lib only skips it when EVAL_ONLY == "true").
          export EVAL_ONLY=false

          # --- Port of scripts/serve.sh optimizations ----------------------
          # The ATOM_* knobs are plain env vars the server reads directly;
          # OMP_NUM_THREADS + AITER_QUICK_REDUCE_QUANTIZATION are what the
          # upstream bench script exports before launch. We launch the server
          # ourselves below, so export them all here (the launch inherits them).
          # ATOM_ENABLE_HIP_MLA_DECODE=0 is a literal port of serve.sh.
          export ATOM_DISABLE_MMAP=0
          export ATOM_USE_AITER_RP=1
          export ATOM_USE_TRITON_MXFP4_BMM=1
          export ATOM_ENABLE_HIP_MLA_DECODE=1
          export OMP_NUM_THREADS=1
          export AITER_QUICK_REDUCE_QUANTIZATION=INT4

          # We launch the atom server ourselves (instead of calling the upstream
          # single_node bench script) so we can (a) control the server CLI flags
          # per serving variant and (b) own the server lifecycle -- start, sweep,
          # shutdown, then restart with new flags -- all inside ONE docker
          # container so the atom JIT cache built by the first server is reused
          # by the second, cutting warm-up time. Guard on the upstream server
          # invocation so an upstream rewrite fails loudly instead of letting us
          # silently run a stale hardcoded launch.
          REF_SCRIPT="benchmarks/single_node/kimik2.5_fp4_mi355x_atom.sh"
          for anchor in 'atom.entrypoints.openai_server' '--kv_cache_dtype fp8' '--trust-remote-code'; do
            grep -q -- "$anchor" "$REF_SCRIPT" || {
              echo "::error::upstream server invocation changed (missing: '$anchor' in $REF_SCRIPT); refusing to run a stale hardcoded launch."
              exit 1
            }
          done

          # Derive base params (model / tp / seq-lens) from the sweep config so a
          # model or yaml change is picked up automatically. The conc dimension
          # is now driven by the explicit CONFIGS array below, not by the
          # generator's conc range -- so we only need a single representative
          # entry here (min-conc == max-conc).
          CONFIG_JSON=$(python3 utils/matrix_logic/generate_sweep_configs.py full-sweep --config-files .github/configs/amd-master.yaml --model-prefix kimik2.5-fp4-mi355x-atom --no-evals --max-tp=4 --min-conc=4 --max-conc=4 --seq-lens=8k1k)
          eval "$(echo "$CONFIG_JSON" | python3 -c "
          import json,sys
          e=json.load(sys.stdin)[0]
          m={
            'MODEL':e['model'],'TP':e['tp'],'ISL':e['isl'],'OSL':e['osl'],
            'EP_SIZE':e.get('ep',1),'PRECISION':e['precision'],
            'FRAMEWORK':e['framework'],'EXP_NAME':e['exp-name'],
          }
          for k,v in m.items(): print(f'export {k}=\"{v}\"')
          ")"
          [ -n "${MODEL:-}" ] || { echo "::error::failed to derive base params from sweep config"; echo "$CONFIG_JSON" | python3 -m json.tool; exit 1; }
          echo "[base] MODEL=$MODEL TP=$TP ISL=$ISL OSL=$OSL EP_SIZE=$EP_SIZE EXP=$EXP_NAME"

          # (CONC NUM_PROMPTS) pairs to sweep. NUM_PROMPTS == CONC*40 so each
          # concurrency level issues a proportional request count (40 rounds of
          # the full concurrent batch) for a stable measurement.
          CONFIGS=(
              "4 160"
              "8 320"
              "16 640"
              "32 1280"
              "64 2560"
              "128 5120"
          )

          # Two serving variants, run back-to-back in this container. Column
          # order in the summary table follows VARIANT_KEYS.
          VARIANT_KEYS=("baseline" "dp_tbo")
          VARIANT_LABELS=("baseline" "dp_attn+tbo")
          VARIANT_FLAGS=("" "--enable-dp-attention --enable-tbo")

          # Fixed atom launch args replicated from $REF_SCRIPT, plus the serve.sh
          # port optimizations. Variant-specific flags are appended per variant.
          PORT=${PORT:-8888}
          SERVER_LOG=/workspace/server.log
          if [ "$ISL" = "1024" ] && [ "$OSL" = "1024" ]; then
            MAX_MODEL_LEN=""
          else
            MAX_MODEL_LEN="--max-model-len 10240"
          fi
          if [ "$EP_SIZE" -gt 1 ]; then
            EP_FLAG="--enable-expert-parallel"
          else
            EP_FLAG=""
          fi
          COMMON_SERVER_FLAGS="--max-num-batched-tokens 16384 --gpu-memory-utilization 0.7 --no-enable_prefix_caching --scheduler-delay-factor 1.0"

          SERVER_PID=""
          start_server() {
            local extra="$1"
            : > "$SERVER_LOG"
            echo "[server] launching (extra flags: ${extra:-none})"
            set -x
            python3 -m atom.entrypoints.openai_server \
                --model "$MODEL" \
                --server-port "$PORT" \
                -tp "$TP" \
                --kv_cache_dtype fp8 $MAX_MODEL_LEN $EP_FLAG \
                $COMMON_SERVER_FLAGS \
                $extra \
                --trust-remote-code \
                > "$SERVER_LOG" 2>&1 &
            SERVER_PID=$!
            set +x
            wait_for_server_ready --port "$PORT" --server-log "$SERVER_LOG" --server-pid "$SERVER_PID"
          }
          stop_server() {
            [ -n "${SERVER_PID:-}" ] || return 0
            echo "[server] shutting down PID=$SERVER_PID"
            kill "$SERVER_PID" 2>/dev/null || true
            for _ in $(seq 1 60); do kill -0 "$SERVER_PID" 2>/dev/null || break; sleep 1; done
            kill -9 "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            SERVER_PID=""
            # Let the GPU release VRAM before the next launch binds the port.
            sleep 10
          }

          FAILED=()
          for vi in "${!VARIANT_KEYS[@]}"; do
            vkey="${VARIANT_KEYS[$vi]}"
            vlabel="${VARIANT_LABELS[$vi]}"
            vflags="${VARIANT_FLAGS[$vi]}"
            echo
            echo "############################################"
            echo "# serving variant: $vkey ($vlabel)"
            echo "# server flags: $COMMON_SERVER_FLAGS $vflags"
            echo "############################################"
            start_server "$vflags"
            start_gpu_monitor --output "/workspace/gpu_metrics_${vkey}.csv"
            for cfg in "${CONFIGS[@]}"; do
              read -r CONC NUM_PROMPTS <<< "$cfg"
              # The tbo variant is only benchmarked at concurrency 128.
              if [ "$vkey" = "dp_tbo" ] && [ "$CONC" != "128" ]; then
                echo "=== [$vkey] skipping CONC=$CONC (tbo runs only at conc 128) ==="
                continue
              fi
              RF="${EXP_NAME}_${PRECISION}_${FRAMEWORK}_tp${TP}-ep${EP_SIZE}_conc${CONC}_${vkey}"
              echo "=== [$vkey] CONC=$CONC NUM_PROMPTS=$NUM_PROMPTS ISL=$ISL OSL=$OSL ==="
              if ! run_benchmark_serving \
                  --model "$MODEL" \
                  --port "$PORT" \
                  --backend vllm \
                  --input-len "$ISL" \
                  --output-len "$OSL" \
                  --random-range-ratio 0.8 \
                  --num-prompts "$NUM_PROMPTS" \
                  --max-concurrency "$CONC" \
                  --result-filename "$RF" \
                  --result-dir /workspace/ \
                  --trust-remote-code; then
                echo "::warning::bench FAILED for variant=$vkey conc=$CONC"
                FAILED+=("$vkey/conc$CONC")
              fi
            done
            stop_gpu_monitor
            stop_server
          done

          # ---- Aggregate both variants into a single comparison table -----
          echo
          echo "============================================"
          echo "[sweep] Perf Sweep Summary (baseline vs dp_attn+tbo)"
          echo "============================================"
          SUMMARY_PAIRS=$(printf '%s;' "${CONFIGS[@]}")
          SUMMARY_PAIRS="$SUMMARY_PAIRS" EXP_NAME="$EXP_NAME" PRECISION="$PRECISION" \
          FRAMEWORK="$FRAMEWORK" TP="$TP" EP_SIZE="$EP_SIZE" python3 -c "
          import json,os,math
          exp=os.environ['EXP_NAME']; prec=os.environ['PRECISION']; fw=os.environ['FRAMEWORK']
          tp=int(os.environ['TP']); ep=int(os.environ['EP_SIZE'])
          pairs=[x.split() for x in os.environ['SUMMARY_PAIRS'].split(';') if x.strip()]
          variants=[('baseline','baseline'),('dp_tbo','dp_attn+tbo')]
          def load(conc,vkey):
            path=f'/workspace/{exp}_{prec}_{fw}_tp{tp}-ep{ep}_conc{conc}_{vkey}.json'
            if not os.path.exists(path): return None
            with open(path) as f: return json.load(f)
          def fmt(v): return 'MISSING' if (v is None or math.isnan(v)) else f'{v:.2f}'
          labels=[lbl for _,lbl in variants]
          cols=['CONC','NUM_PROMPTS']
          for lbl in labels: cols.append(f'total tok/s ({lbl})')
          for lbl in labels: cols.append(f'output tok/s ({lbl})')
          for lbl in labels: cols.append(f'per-GPU total /{tp} ({lbl})')
          for lbl in labels: cols.append(f'e2e (s) ({lbl})')
          for lbl in labels: cols.append(f'interactivity tok/s/user ({lbl})')
          cols.append('total speedup (dp_attn+tbo / baseline)')
          print('| '+' | '.join(cols)+' |')
          print('|'+'|'.join(['---:']*len(cols))+'|')
          # e2e (mean, s) = ttft + tpot*(avg_out-1); interactivity = 1000/median_tpot
          # -- same formulas as kimi/perf_sweep.sh.
          def e2e(d):
            if not d: return None
            completed=float(d.get('completed',0)) or 1.0
            avg_out=float(d.get('total_output_tokens',0))/completed
            return (float(d.get('mean_ttft_ms',float('nan')))
                    + float(d.get('mean_tpot_ms',float('nan')))*(avg_out-1))/1000.0
          def inter(d):
            if not d: return None
            m=float(d.get('median_tpot_ms',float('nan')))
            return 1000.0/m if m else float('nan')
          for conc,nump in pairs:
            tot={}; out={}; e2={}; it={}
            for vk,_ in variants:
              d=load(conc,vk)
              tot[vk]=float(d.get('total_token_throughput',float('nan'))) if d else None
              out[vk]=float(d.get('output_throughput',float('nan'))) if d else None
              e2[vk]=e2e(d); it[vk]=inter(d)
            row=[conc,nump]
            for vk,_ in variants: row.append(fmt(tot[vk]))
            for vk,_ in variants: row.append(fmt(out[vk]))
            for vk,_ in variants:
              v=tot[vk]; row.append('MISSING' if (v is None or math.isnan(v)) else f'{v/tp:.2f}')
            for vk,_ in variants: row.append(fmt(e2[vk]))
            for vk,_ in variants: row.append(fmt(it[vk]))
            b=tot['baseline']; x=tot['dp_tbo']
            ok=b and x and not math.isnan(b) and not math.isnan(x) and b>0
            row.append(f'{x/b:.3f}x' if ok else '-')
            print('| '+' | '.join(map(str,row))+' |')
          "

          if [ "${#FAILED[@]}" -ne 0 ]; then
            echo "::error::benchmarks failed for: ${FAILED[*]}"
            exit 1
          fi
          EOF

          docker run --rm --init --network=host --privileged=true \
            -e PIP_CONSTRAINT="" \
            -e ATOM_REPO_KEY \
            -e AITER_REPO_KEY \
            -v /dev/shm:/dev/shm \
            --device /dev/kfd \
            --device /dev/dri   \
            --security-opt seccomp=unconfined \
            --entrypoint=/bin/bash \
            -v "$GITHUB_WORKSPACE/InferenceX:/root/InferenceX" \
            -v "$GITHUB_WORKSPACE/run_inferencex_bench.sh:/root/run_inferencex_bench.sh:ro" \
            -e HF_HUB_CACHE=/dev/shm \
            rocm/atom:rocm7.2.3_ubuntu24.04_py3.12_pytorch_release_2.10.0_atom20260511 \
            -lc 'bash /root/run_inferencex_bench.sh' 2>&1 \
            | grep -v --line-buffered "Calling super().encode with"
          # ^ The Kimi tokenizer's remote code (loaded via --trust-remote-code)
          #   print()s "Calling super().encode with {...}" on every encode call,
          #   which the bench client invokes once per request -- thousands of
          #   lines across the conc sweep. It's a raw print (no log level to
          #   silence), so we filter it from the log stream here. The default GH
          #   Actions bash shell runs with `set -o pipefail`, so docker's exit
          #   code still propagates and a real bench failure still fails the step.
